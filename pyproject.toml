[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-regex-scanner"
version = "0.4.0"
description = "Rule-driven PII evidence scanner and identity clustering pipeline"
requires-python = ">=3.10"

[project.scripts]
pii-regex-scanner = "pii_regex_scanner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
